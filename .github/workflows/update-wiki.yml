name: 自动更新知识库

on:
  push:
    paths:
      - 'raw/articles/**'
      - '.github/workflows/update-wiki.yml'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  update-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Node 依赖
        run: |
          cd code/web
          npm install

      - name: 运行 ingest.py 生成摘要
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: https://api.deepseek.com/v1
          LLM_MODEL: deepseek-v4-pro
          LLM_THINKING: disabled
        run: |
          echo "API Key 长度: ${#DEEPSEEK_API_KEY}"
          echo "模型: $LLM_MODEL @ $LLM_BASE_URL"
          python code/ingest.py

      - name: 运行 build-data.py 生成 JSON
        run: |
          python code/web/scripts/build-data.py || echo "build-data.py 执行失败，但继续"

      - name: 提交更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add wiki/ code/web/public/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动更新：知识库数据 $(date +'%Y-%m-%d %H:%M:%S')" && git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main)

      - name: 部署到 Fly.io
        if: success()
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: 执行部署
        if: success()
        # fly.toml 在 code/web/ 下，必须在那个目录里执行，否则找不到配置
        working-directory: code/web
        run: flyctl deploy -a zhiao-wiki
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
