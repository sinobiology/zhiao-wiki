name: 自动更新知识库

on:
  push:
    paths:
      - 'raw/articles/**'
      - '.github/workflows/update-wiki.yml'
  workflow_dispatch:  # 允许手动触发

jobs:
  update-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install anthropic

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Node 依赖
        run: |
          cd code/web
          npm install

      - name: 运行 ingest.py 生成摘要
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.aicodewith.com/v1
        run: |
          python code/ingest.py

      - name: 运行 build-data.py 生成 JSON
        run: |
          python code/web/scripts/build-data.py

      - name: 提交更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add wiki/ code/web/public/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动更新：知识库数据 $(date +'%Y-%m-%d %H:%M:%S')" && git push)

      - name: 部署通知
        if: success()
        run: |
          echo "✅ 知识库已更新！"
          echo "请运行以下命令重新部署到 Fly.io："
          echo "flyctl deploy -a zhiao-wiki"
