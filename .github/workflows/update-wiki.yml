name: 自动更新知识库

on:
  push:
    paths:
      # 新增原文 → 生成摘要 → 打包数据 → 部署
      - 'raw/articles/**'
      # 前端与后端源码改动同样需要重新构建部署
      # ⚠️ 切勿把 wiki/** 或 code/web/public/** 加进来：本工作流结束时会提交这两个目录，
      #    一旦纳入触发路径就会自触发，形成无限循环。
      - 'code/web/src/**'
      - 'code/web/index.html'
      - 'code/web/server.js'
      - 'code/web/package.json'
      - 'code/web/vite.config.js'
      - 'code/web/Dockerfile'
      - 'code/web/fly.toml'
      - 'code/web/scripts/build-data.py'
      - 'code/ingest.py'
      - '.github/workflows/update-wiki.yml'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

# 同一时间只允许一个知识库更新任务。
# 不加这行时，短时间内触发两次（或上一次的自动提交还没落地）会出现两个构建
# 同时在「提交更新」步 push，后者必然 non-fast-forward 失败，在 Actions 里留个红叉。
# cancel-in-progress 保持 false：宁可排队，也不要打断正在进行中的部署。
concurrency:
  group: update-wiki
  cancel-in-progress: false

jobs:
  update-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Node 依赖
        run: |
          cd code/web
          npm install

      - name: 运行 ingest.py 生成摘要
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: https://api.deepseek.com/v1
          LLM_MODEL: deepseek-v4-pro
          LLM_THINKING: disabled
        run: |
          echo "API Key 长度: ${#DEEPSEEK_API_KEY}"
          echo "模型: $LLM_MODEL @ $LLM_BASE_URL"
          python code/ingest.py

      - name: 运行 build-data.py 生成 JSON
        run: |
          python code/web/scripts/build-data.py || echo "build-data.py 执行失败，但继续"

      - name: 提交更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add wiki/ code/web/public/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动更新：知识库数据 $(date +'%Y-%m-%d %H:%M:%S')" && git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main)

      - name: 部署到 Fly.io
        if: success()
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: 同步应用密钥到 Fly.io
        if: success()
        # 线上 /api/chat 需要 DEEPSEEK_API_KEY 与 ACCESS_PASSWORD。
        # 用 --stage 暂存，随下面的 deploy 一起生效，避免额外触发一次发布。
        # 值未变化时 flyctl 无操作。
        # ⚠️ ACCESS_PASSWORD 曾经硬编码在 server.js 里（默认值 zhiao2026），
        #    公开仓库＝公开入口，被人刷接口烧掉 300+ 元。现在只从 Secret 注入。
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::warning::未配置 DEEPSEEK_API_KEY secret，线上对话接口将不可用"
          else
            flyctl secrets set DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" -a zhiao-wiki --stage
          fi
          if [ -z "$ACCESS_PASSWORD" ]; then
            echo "::warning::未配置 ACCESS_PASSWORD secret，线上对话接口将保持关闭（fail-closed）"
          else
            flyctl secrets set ACCESS_PASSWORD="$ACCESS_PASSWORD" -a zhiao-wiki --stage
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}

      - name: 执行部署
        if: success()
        # fly.toml 在 code/web/ 下，必须在那个目录里执行，否则找不到配置
        working-directory: code/web
        run: flyctl deploy -a zhiao-wiki
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
